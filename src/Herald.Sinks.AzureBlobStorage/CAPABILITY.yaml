name: Herald.Sinks.AzureBlobStorage
package_id: Herald.Sinks.AzureBlobStorage
version: 1.0.0
configContract: 2
formSchema: configuration-azure_blob.mmpform
kind: sink
category: cloud
purpose: >
  Uploads Herald log events as NDJSON blobs to an Azure Blob Storage
  container. Drop-in for Serilog.Sinks.AzureBlobStorage. Pairs with
  App Insights / Log Analytics for cheap retention.
vendor:
  name: Microsoft Azure
  url: https://learn.microsoft.com/azure/storage/blobs/
ships:
  - AzureBlobStorageLogSink
  - AzureBlobStorageLogSinkProvider
  - AzureBlobStorageSinkRegistration
requires:
  core_version: ">=1.0.0"
  external:
    - Azure.Storage.Blobs
    - Azure.Identity
    - Storage account + container
config:
  kind: azure_blob
  uri: "Connection string (required)."
  host: "Container name (required)."
  alias: "Optional key prefix. Default 'logs'."

capabilities:
  - Date-partitioned key layout (yyyy-MM-dd) for listable containers
  - NDJSON body — streams into Azure Synapse / Data Lake Analytics queries
  - Connection-string or DefaultAzureCredential auth (managed identity, etc.)
  - One blob per batch — batch sizing drives object count
limitations:
  - No append-blob mode in 1.0 (block blobs only)
  - Synchronous Send via blob.Upload
  - No SAS-only auth helper — feed via connection string
minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — Azure SDK BlobContainerClient is thread-safe.
test_coverage: tests/Herald.Sinks.AzureBlobStorage.Tests/
product_pack: []
maintenance:
  level: active
  owner: mmpworks
  last_audit: 2026-04-24
changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Initial release — 1.3 pack.
