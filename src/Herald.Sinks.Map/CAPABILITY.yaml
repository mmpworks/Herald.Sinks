# CAPABILITY.yaml — Herald.Sinks.Map (migration guide)
#
# This folder is a guide, not a NuGet package. The kind below is
# `migration-guide` so the product-sheet generator lists it in a
# separate section from real sinks.

name: Herald.Sinks.Map
package_id: null
version: 1.0.0
kind: migration-guide
category: routing

purpose: >
  Shows Herald users how to replicate Serilog.Sinks.Map's property-
  based dispatch without a wrapper sink — using Herald's built-in
  filter-expression routing and, when pipelines need full isolation,
  WithBridge.

serilog_equivalent: Serilog.Sinks.Map

herald_api:
  - QuickLogBuilder.WithFilterExpression(...)
  - QuickLogBuilder.WithFileSink(..., filterExpression: "...")
  - QuickLogBuilder.WithBridge(logger, predicate)

guide: README.md

maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-24
