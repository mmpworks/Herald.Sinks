# CAPABILITY.yaml — Herald.Sinks.File

name: Herald.Sinks.File
package_id: MMP.Herald.Sinks.File
version: 1.0.0
kind: sink
category: io

# v2 form-schema marker. The presence of `formSchema:` tells the
# Dashboard server this sink ships an mmpform-driven configuration UI;
# ILogSinkProvider.GetFormSchemaText() resolves the actual file per
# provider — this package ships configuration-text_file.mmpform and
# configuration-json_file.mmpform side by side, so the value here is
# advisory and the per-kind lookup wins.
formSchema: per-kind

purpose: >
  Writes Herald log events to disk. Plain-text mode produces
  human-readable lines; structured mode produces NDJSON for
  machine parsing. Optional file rolling for time-based or
  size-based rotation, with per-pipeline path templating.

vendor:
  name: MMP

ships:
  - TextFileSinkProvider
  - JsonFileSinkProvider

requires:
  core_version: ">=1.0.0"
  external: []

config:
  kind: file

# The legacy `dashboard_config:` block was retired alongside the v1
# form path. Both providers shipped here (text_file, json_file) carry
# their own configuration-{kind}.mmpform and the dashboard renders
# those through MmpformRenderer. Adding a new file-sink kind to this
# package: drop a configuration-{kind}.mmpform next to the others and
# Directory.Build.props embeds it automatically.

capabilities:
  - Plain-text or NDJSON output via the format toggle
  - Time-based rolling (hour / day / week)
  - Size-based rolling (maxBytes per file)
  - Retention by file count or total size cap
  - Path templating with {pipeline}, {date}, {hour} tokens

limitations:
  - Local filesystem only (use a remote sink for cloud storage)
  - One file per sink instance — fan-out via multiple sink registrations

minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe via internal lock around write+flush.

test_coverage: tests/Herald.Sinks.File.Tests/

product_pack: []

maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-28

changelog:
  - version: 1.0.0
    date: 2026-04-28
    summary: Extracted from Herald.Core into a standalone sink package.
