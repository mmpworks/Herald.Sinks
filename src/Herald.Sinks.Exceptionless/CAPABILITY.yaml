name: Herald.Sinks.Exceptionless
package_id: MMP.Herald.Sinks.Exceptionless
version: 1.0.0
kind: sink
category: alerting
purpose: >
  Forwards Herald log events to the Exceptionless error-tracking
  platform via the v2 events API. Drop-in for Serilog.Sinks.Exceptionless.
vendor:
  name: Exceptionless
  url: https://exceptionless.com/docs/
ships:
  - ExceptionlessLogSink
  - ExceptionlessLogSinkProvider
  - ExceptionlessSinkRegistration
requires:
  core_version: ">=1.0.0"
  external:
    - Exceptionless API key
config:
  kind: exceptionless
  alias: "API key (required)."
  uri: "Server URL. Default https://collector.exceptionless.io. Override for self-hosted."
dashboard_config:
  - property: api_key
    name: API key
    width: xl
    control: secret
    required: true
    group: Auth
  - property: server_url
    name: Server URL
    width: l
    control: url
    required: false
    default: https://collector.exceptionless.io
    group: Target
capabilities:
  - Bulk POST per IBatchedLogSink
  - Bearer-token auth
  - Event type "log" vs "error" auto-detected from context exception
  - Self-hosted server URL override
limitations:
  - Synchronous Send
minimum_edition: Pro
aot_compatible: true
thread_safety: Thread-safe.
test_coverage: tests/Herald.Sinks.Exceptionless.Tests/
product_pack: []
maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-24
changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Initial release — 1.3 pack.
