name: Herald.Sinks.Dynatrace
package_id: Herald.Sinks.Dynatrace
version: 1.0.0
configContract: 2
formSchema: configuration-dynatrace.mmpform
kind: sink
category: observability
purpose: >
  Posts Herald log events to Dynatrace Generic Log Ingest API via HTTP
  with Api-Token authentication. Drop-in for Serilog.Sinks.Dynatrace.
  No Dynatrace SDK dependency.
vendor:
  name: Dynatrace
  url: https://docs.dynatrace.com/docs/discover-dynatrace/references/dynatrace-api/environment-api/log-monitoring/post-ingest-logs
ships:
  - DynatraceLogSink
  - DynatraceLogSinkProvider
  - DynatraceSinkRegistration
requires:
  core_version: ">=1.0.0"
  external:
    - Dynatrace environment URL + API token with logs.ingest scope
config:
  kind: dynatrace
  uri: "Environment URL (required). e.g. https://abc123.live.dynatrace.com"
  alias: "API token with logs.ingest scope (required)."

capabilities:
  - Batched POST per IBatchedLogSink
  - Severity mapping (DEBUG/INFO/WARN/ERROR/CRITICAL)
  - Pure HTTP — no Dynatrace SDK
limitations:
  - 5 MB / 50,000-entry request ceiling enforced by Dynatrace
  - Synchronous Send path — pair with async decorator
minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — shared HttpClient.
test_coverage: tests/Herald.Sinks.Dynatrace.Tests/
product_pack: []
maintenance:
  level: active
  owner: mmpworks
  last_audit: 2026-04-24
changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Initial release — 1.2 Extended Pack.
