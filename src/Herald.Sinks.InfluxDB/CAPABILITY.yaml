name: Herald.Sinks.InfluxDB
package_id: Herald.Sinks.InfluxDB
version: 1.0.0
configContract: 2
formSchema: configuration-influxdb.mmpform
kind: sink
category: database
purpose: >
  Writes Herald log events to InfluxDB v2 via line protocol over HTTP.
  No InfluxDB SDK dependency. Tags carry level + category; message
  rides as a field. Code-first only.
vendor:
  name: InfluxData
  url: https://www.influxdata.com
ships:
  - InfluxDBLogSink
  - InfluxDBLogSinkProvider
  - InfluxDBSinkRegistration
requires:
  core_version: ">=1.0.0"
  external:
    - InfluxDB v2 cluster + API token
config:
  kind: influxdb
  notes: Code-first only.
capabilities:
  - HTTP POST per batch as line protocol
  - Token auth (Authorization Token <token>)
  - Tags level + category for cardinality-aware indexing
  - ms-precision timestamps
  - Opt-in PreserveProperties (default off) — carries arbitrary properties as fields (never tags), type-mapped, with a per-event soft cap (preserve_field_limit, default 32)
limitations:
  - Provider throws — credentials + bucket must be wired via code-first
  - No retention or downsampling helpers (operator responsibility)
  - PreserveProperties ships ALL event properties downstream — ensure your redaction/enrichment pipeline runs before the sink
  - PreserveProperties carries properties as fields — still subject to your schema cardinality budget; InfluxDB pins a field type on first write, so mixed types across events for the same key are an application-discipline concern, not a sink bug
minimum_edition: Community
aot_compatible: true
thread_safety: HttpClient is thread-safe per BCL contract.
test_coverage: tests/Herald.Sinks.InfluxDB.Tests/
maintenance:
  level: active
  owner: mmpworks
  last_audit: 2026-04-25
changelog:
  - version: 1.0.0
    date: 2026-04-25
    summary: Initial release — 1.12 analytics tier.
