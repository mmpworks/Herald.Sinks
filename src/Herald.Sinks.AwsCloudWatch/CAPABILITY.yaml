# CAPABILITY.yaml — Herald.Sinks.AwsCloudWatch

name: Herald.Sinks.AwsCloudWatch
package_id: MMP.Herald.Sinks.AwsCloudWatch
version: 1.0.0
kind: sink
category: cloud

purpose: >
  Writes Herald log events to an AWS CloudWatch Logs log group / log
  stream via PutLogEvents. Drop-in for Serilog.Sinks.AwsCloudWatch.
  Honours CloudWatch's 10,000-event / 1 MB batch ceiling and the 256 KB
  single-event ceiling. Optional auto-create of log group and stream.

vendor:
  name: Amazon Web Services
  url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/

ships:
  - AwsCloudWatchLogSink
  - AwsCloudWatchLogSinkProvider
  - AwsCloudWatchSinkRegistration

requires:
  core_version: ">=1.0.0"
  external:
    - AWSSDK.CloudWatchLogs
    - IAM credentials with logs:PutLogEvents (and optionally logs:CreateLogGroup / logs:CreateLogStream)

config:
  kind: aws_cloudwatch
  uri: "logGroup/logStream — both required."
  host: "AWS region system name (us-east-1, etc.). Optional — falls back to SDK default."
  alias: "'auto-create' to create the log group and stream on first write."
  notes: >
    Credential resolution is the AWS SDK default chain: environment,
    shared credentials, IMDS, SSO, role. Production typically uses an
    IAM role attached to the compute platform.

dashboard_config:
  - property: log_group
    name: Log group
    help: CloudWatch log group name. Must exist or enable auto-create.
    tooltip: CloudWatch log group.
    width: l
    control: text
    required: true
    group: Target
  - property: log_stream
    name: Log stream
    help: CloudWatch log stream name under the log group.
    tooltip: CloudWatch log stream.
    width: l
    control: text
    required: true
    group: Target
  - property: region
    name: Region
    help: AWS region system name. Leave blank to use the SDK default.
    tooltip: AWS region (us-east-1, eu-west-2, ...).
    width: s
    control: text
    required: false
    group: Target
  - property: auto_create
    name: Auto-create
    help: Create the log group and stream on first write. Requires IAM permission.
    tooltip: Auto-create log group + stream.
    width: xs
    control: checkbox
    required: false
    default: false
    group: Target

capabilities:
  - Single and batched PutLogEvents (respects 10,000-event / 1 MB / 256 KB ceilings)
  - Stable-sort by timestamp to satisfy CloudWatch's chronological-order requirement
  - JSON-formatted message bodies for CloudWatch Logs Insights queries
  - Default AWS credential chain (env, shared creds, IMDS, SSO, role)
  - Code-first overload accepts a pre-built IAmazonCloudWatchLogs client

limitations:
  - No retention-policy management — configure via IaC or installer
  - Oversize events truncate silently rather than fail the batch
  - Synchronous Send path (.GetAwaiter().GetResult() around async AWS SDK calls)

minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — the AWS SDK client is thread-safe per AWS SDK contract.

test_coverage: tests/Herald.Sinks.AwsCloudWatch.Tests/ (construction coverage; AWS-backed tests are manual)

product_pack: []

maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-24

changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Initial release — 1.1 parity pack (Serilog.Sinks.AwsCloudWatch equivalent).
