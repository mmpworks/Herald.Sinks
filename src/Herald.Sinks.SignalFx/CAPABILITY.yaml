# CAPABILITY.yaml — Herald.Sinks.SignalFx
#
# This is the authoritative contract the Dashboard, the product-sheet
# generator, and the release pipeline all read. The csproj version,
# assembly name, and package id must line up with the values below.

# ─── Identity ─────────────────────────────────────────────────────────
name: Herald.Sinks.SignalFx
package_id: MMP.Herald.Sinks.SignalFx
version: 1.0.0
configContract: 2
formSchema: configuration-signalfx.mmpform
kind: sink
category: observability

# ─── Human-readable ──────────────────────────────────────────────────
purpose: >
  Posts Herald log events to SignalFx / Splunk Observability Cloud's
  HTTP log intake. Routes by realm or against a self-hosted Splunk
  Observability endpoint, with optional low-cardinality dimensions
  applied to every event for metric correlation.

vendor:
  name: Splunk
  url: https://docs.splunk.com/observability/en/admin/logs/logs.html

# ─── What ships ──────────────────────────────────────────────────────
ships:
  - SignalFxLogSink
  - SignalFxLogSinkProvider
  - SignalFxSinkRegistration

# ─── Dependencies ────────────────────────────────────────────────────
requires:
  core_version: ">=1.0.0"
  external:
    - SignalFx / Splunk Observability access token (X-SF-Token)
    - Reachable HTTP endpoint (public realm intake or self-hosted URL)

# ─── JSON-config surface (low-level runtime shape) ───────────────────
config:
  kind: signalfx
  uri: "Full ingest URL — overrides realm when set."
  host: "Realm name (e.g. us0, us1, eu0). Ignored when Uri is set."
  alias: "SignalFx access token; used as the X-SF-Token header."
  notes: >
    When both Uri and Host are absent the sink defaults to the us0
    realm. Dimensions are not surfaced through JSON config; callers
    that need them construct SignalFxLogSink directly and register via
    WithCustomSinkProvider.

# ─── Dashboard-facing configuration ──────────────────────────────────

# ─── Capabilities (feature bullets) ──────────────────────────────────
capabilities:
  - Batched delivery via IBatchedLogSink
  - Realm-based default endpoint with full-URL override for self-hosted
  - Low-cardinality dimensions emitted on every event for metric correlation
  - Per-event properties land at payload root; exceptions expand to exception / exception.type
  - Reserved-field collision guard (seen-set prevents property-over-reserved overwrites)

# ─── Limitations (what we do NOT do) ─────────────────────────────────
limitations:
  - No gzip compression on the request body
  - Dimensions configured at construction only — not surfaced through JSON config
  - Synchronous Send path; pair with the async decorator for high-throughput pipelines

# ─── Compliance + operational ────────────────────────────────────────
minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — shared HttpClient, synchronous Send.

test_coverage: tests/Herald.Sinks.SignalFx.Tests/SignalFxLogSinkTests.cs (7 tests)

# ─── Metapackage membership ──────────────────────────────────────────
product_pack:
  - Herald.Business
  - Herald.Game.Pro

# ─── Maintenance status ──────────────────────────────────────────────
maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-23

# ─── Breaking changes ────────────────────────────────────────────────
changelog:
  - version: 1.0.0
    date: 2026-04-23
    summary: Initial release — migrated from Herald.Core Addons/SignalFx.
