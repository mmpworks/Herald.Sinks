name: Herald.Sinks.Honeycomb
package_id: MMP.Herald.Sinks.Honeycomb
version: 1.0.0
configContract: 2
formSchema: configuration-honeycomb.mmpform
kind: sink
category: observability

purpose: >
  Posts Herald log events to Honeycomb's batch ingest endpoint. Maps
  each event onto Honeycomb's flat data-object shape with per-event
  sample-rate support so aggregates stay correct when an upstream
  sampler is in play.

vendor:
  name: Honeycomb
  url: https://docs.honeycomb.io/api/tag/Events

ships:
  - HoneycombLogSink
  - HoneycombLogSinkProvider
  - HoneycombSinkRegistration

requires:
  core_version: ">=1.0.0"
  external:
    - Honeycomb API key (classic team key or ingest-only key)
    - Reachable Honeycomb ingest endpoint (public or Refinery)

config:
  kind: honeycomb
  uri: "Optional endpoint override (Refinery / self-hosted)."
  host: "Honeycomb dataset name."
  alias: "Honeycomb API key — X-Honeycomb-Team."
  notes: >
    When the override URL omits the /1/batch/{dataset} path the sink
    appends it. Sample rate is set at construction and not currently
    surfaced through JSON config.

capabilities:
  - Batched delivery via IBatchedLogSink
  - Per-event samplerate for upstream-sampled pipelines
  - Full level / category / message / messageTemplate on every event
  - Exception emission as exception + exception.type flat fields
  - Reserved-field collision guard

limitations:
  - Flat data shape only — nested properties stringified
  - Synchronous Send path; pair with async decorator for throughput
  - Sample rate configurable at construction, not through JSON config

minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — shared HttpClient, synchronous Send.

test_coverage: tests/Herald.Sinks.Honeycomb.Tests/HoneycombLogSinkTests.cs (8 tests)

product_pack:
  - Herald.Business
  - Herald.Game.Pro

maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-24

changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Migrated from Herald.Core Addons/Honeycomb.
