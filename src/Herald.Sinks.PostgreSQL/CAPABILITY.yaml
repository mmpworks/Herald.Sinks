# CAPABILITY.yaml — Herald.Sinks.PostgreSQL

name: Herald.Sinks.PostgreSQL
package_id: MMP.Herald.Sinks.PostgreSQL
version: 1.0.0
configContract: 2
formSchema: configuration-postgresql.mmpform
kind: sink
category: database

purpose: >
  Writes Herald log events as rows in a PostgreSQL table. Drop-in for
  Serilog.Sinks.PostgreSQL. Parameterized INSERT for single writes,
  binary COPY for batches (~10x faster than prepared INSERTs),
  optional auto-create DDL.

vendor:
  name: PostgreSQL
  url: https://www.postgresql.org

ships:
  - PostgreSQLLogSink
  - PostgreSQLLogSinkProvider
  - PostgreSQLSinkRegistration
  - PostgreSQLColumnOptions

requires:
  core_version: ">=1.0.0"
  external:
    - Npgsql
    - PostgreSQL 12+ (JSONB support)

config:
  kind: postgresql
  uri: "Connection string (required)."
  host: "schema.table (default public.logs)."
  alias: "'auto-create' to enable CREATE TABLE IF NOT EXISTS DDL."
  notes: >
    Custom column names require constructing PostgreSQLLogSink
    directly and registering via WithCustomSinkProvider. Properties
    are stored as JSONB for native JSON query support.

capabilities:
  - Parameterized INSERT for single-event Log calls
  - Binary COPY via NpgsqlBinaryImporter for IBatchedLogSink batches
  - Properties stored as JSONB for native JSON query (WHERE properties->>'TenantId' = 'acme')
  - Custom column-name options via PostgreSQLColumnOptions
  - Optional idempotent auto-create DDL
  - Connection pooling via Npgsql

limitations:
  - Requires PostgreSQL 12+ for JSONB column type
  - No schema migration — pre-existing tables with a narrower schema fail on first write
  - No COPY CSV fallback — BinaryImporter only

minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — each call opens a pooled Npgsql connection.

test_coverage: tests/Herald.Sinks.PostgreSQL.Tests/ (construction coverage; DB-backed tests are manual)

product_pack: []

maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-24

changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Initial release — 1.1 parity pack (Serilog.Sinks.PostgreSQL equivalent).
