name: Herald.Sinks.NewRelicLogs
package_id: Herald.Sinks.NewRelicLogs
version: 1.0.0
configContract: 2
formSchema: configuration-newrelic_logs.mmpform
kind: sink
category: observability
purpose: >
  Ships Herald log events to the New Relic Logs ingest API. Drop-in
  for Serilog.Sinks.NewRelic.Logs. Pure HTTP — no New Relic SDK
  dependency.
vendor:
  name: New Relic
  url: https://docs.newrelic.com/docs/logs/log-api/introduction-log-api/
ships:
  - NewRelicLogsLogSink
  - NewRelicLogsLogSinkProvider
  - NewRelicLogsSinkRegistration
requires:
  core_version: ">=1.0.0"
  external:
    - New Relic license key
config:
  kind: newrelic_logs
  alias: "License key (required)."
  uri: "Endpoint. Default https://log-api.newrelic.com/log/v1 (US). Use log-api.eu.newrelic.com for EU."

capabilities:
  - Batched POST per IBatchedLogSink
  - Properties emitted as flat attributes for NRQL query
  - Region-aware endpoint default with EU override
  - Exception class + full text on attributes object
limitations:
  - 5 MB / 1 MB-per-record request ceiling enforced by New Relic
  - Synchronous Send
minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — shared HttpClient.
test_coverage: tests/Herald.Sinks.NewRelicLogs.Tests/
product_pack: []
maintenance:
  level: active
  owner: mmpworks
  last_audit: 2026-04-24
changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Initial release — 1.3 Alerting + Cloud Completion pack.
