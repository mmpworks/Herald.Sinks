# CAPABILITY.yaml — Herald.Sinks.MongoDB

name: Herald.Sinks.MongoDB
package_id: Herald.Sinks.MongoDB
version: 1.0.0
configContract: 2
formSchema: configuration-mongodb.mmpform
kind: sink
category: database

purpose: >
  Writes Herald log events as BSON documents into a MongoDB
  collection. Drop-in for Serilog.Sinks.MongoDB. Single InsertOne on
  Log, unordered InsertMany for IBatchedLogSink batches. Works with
  capped collections for bounded retention.

vendor:
  name: MongoDB
  url: https://www.mongodb.com

ships:
  - MongoDBLogSink
  - MongoDBLogSinkProvider
  - MongoDBSinkRegistration

requires:
  core_version: ">=1.0.0"
  external:
    - MongoDB.Driver
    - MongoDB 4.4+

config:
  kind: mongodb
  uri: "MongoDB connection string (required)."
  host: "database.collection (default herald.logs)."
  notes: >
    Code-first ctor accepts a pre-built IMongoCollection so apps can
    share a MongoClient singleton with their repositories.

capabilities:
  - InsertOne per event on the Log path
  - Unordered InsertMany for batches (bad doc does not block the rest)
  - BSON primitive mapping for property values (string, bool, int, long, double, decimal, DateTime, Guid)
  - Code-first overload accepts a pre-built IMongoCollection for shared MongoClient scenarios
  - Works with capped collections for bounded retention

limitations:
  - No TLS / client-cert construction helpers — feed them through the connection string
  - Property values of non-primitive types fall back to ToString()
  - No retention or TTL index management — operator responsibility

minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — the underlying MongoClient is thread-safe per driver contract.

test_coverage: tests/Herald.Sinks.MongoDB.Tests/ (construction coverage; DB-backed tests are manual)

product_pack: []

maintenance:
  level: active
  owner: mmpworks
  last_audit: 2026-04-24

changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Initial release — 1.1 parity pack (Serilog.Sinks.MongoDB equivalent).
