# CAPABILITY.yaml — Herald.Sinks.Async (migration guide)

name: Herald.Sinks.Async
package_id: null
version: 1.0.0
kind: migration-guide
category: delivery

purpose: >
  Shows Herald users how to replicate Serilog.Sinks.Async — Serilog's
  per-sink async wrapper — using Herald's pipeline-wide
  WithAsyncLogging step. Covers drop strategies, capacity sizing,
  shutdown drain, and game-loop patterns.

serilog_equivalent: Serilog.Sinks.Async

herald_api:
  - QuickLogBuilder.WithAsyncLogging(capacity, dropStrategy, deferRendering)
  - KnownDropStrategies.DropWrite
  - KnownDropStrategies.Wait
  - KnownDropStrategies.DropOldest
  - AsyncLogger.QueueDepth
  - ILogFailureSink (drop visibility)

guide: README.md

maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-24
