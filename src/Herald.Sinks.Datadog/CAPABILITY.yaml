name: Herald.Sinks.Datadog
package_id: Herald.Sinks.Datadog
version: 1.0.0
configContract: 2
formSchema: configuration-datadog.mmpform
kind: sink
category: observability

purpose: >
  Posts Herald log events to Datadog's HTTP log intake. Works against
  both the public site intake and a local Datadog Agent, with per-event
  error-triple emission that lights up Datadog's error-tracking
  pipeline in addition to plain log search.

vendor:
  name: Datadog
  url: https://docs.datadoghq.com/api/latest/logs/

ships:
  - DatadogLogSink
  - DatadogLogSinkProvider
  - DatadogSinkRegistration

requires:
  core_version: ">=1.0.0"
  external:
    - Datadog API key (DD-API-KEY)
    - Reachable HTTP endpoint (public intake or local Agent)

config:
  kind: datadog
  uri: "Datadog intake URL, e.g. https://http-intake.logs.datadoghq.com"
  host: "Service name (Datadog 'service' attribute)"
  alias: "DD-API-KEY header value"
  notes: >
    Uri optional — defaults to the public US intake. Set to
    http://localhost:8126 to route through a local Datadog Agent.

capabilities:
  - Batched delivery via IBatchedLogSink
  - Level mapping to Datadog status (trace→debug, fatal→emergency)
  - Exception triple (error.message / error.kind / error.stack)
  - Static tags merge with per-event category into ddtags
  - Works direct-to-Datadog or via a local Datadog Agent

limitations:
  - No compression today (gzip support is a future enhancement)
  - Static tags only via construction; JSON config limited to URI / service / key
  - Synchronous Send path; pair with the async decorator for throughput

minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — shared HttpClient, synchronous Send.

test_coverage: tests/Herald.Sinks.Datadog.Tests/DatadogLogSinkTests.cs (9 tests)

product_pack:
  - Herald.Business
  - Herald.Game.Pro

maintenance:
  level: active
  owner: mmpworks
  last_audit: 2026-04-24

changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Migrated from Herald.Core Addons/Datadog.
