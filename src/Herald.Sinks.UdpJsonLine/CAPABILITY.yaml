name: Herald.Sinks.UdpJsonLine
package_id: MMP.Herald.Sinks.UdpJsonLine
version: 1.0.0
configContract: 2
formSchema: configuration-udp_json_line.mmpform
kind: sink
category: observability

purpose: >
  Fires Herald log events as newline-delimited JSON datagrams over UDP.
  One datagram per event, no acknowledgement, no retry. Fits syslog-style
  collectors and lossy-tolerant pipelines where drop-tolerance is
  acceptable and latency matters more than durability.

vendor:
  name: Herald
  url: https://github.com/smuchow1962/Herald.Sinks

ships:
  - UdpJsonLineLogSink
  - UdpJsonLineSinkProvider
  - UdpJsonLineSinkRegistration

requires:
  core_version: ">=1.0.0"
  external:
    - Reachable UDP endpoint accepting JSON-line datagrams
    - Trusted network path (plaintext; no built-in DTLS)

config:
  kind: udp_json_line
  uri: null
  host: "Destination host name or IP."
  alias: null
  notes: >
    Port is supplied on the LoggingRuntimeSinkDefinition.Port field.
    Per-event payload capped at 65,000 bytes; oversized events throw
    rather than fragment silently.

capabilities:
  - Fire-and-forget datagram delivery — minimal per-event cost
  - Async path (LogAsync / LogBatchAsync) for the AsyncLogger drain
  - Lazy DNS resolution (doesn't block construction on unreachable host)
  - Per-event 65,000-byte hard ceiling with helpful error on oversized events

limitations:
  - No delivery guarantee — events can be silently dropped by the network
  - No retry, no acknowledgement, no ordering guarantee
  - Plaintext only — no built-in DTLS
  - Per-event size capped (not suited for large property bags or dumps)

minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — UdpClient.Send / SendAsync are reentrant.

test_coverage: tests/Herald.Sinks.UdpJsonLine.Tests/UdpJsonLineLogSinkTests.cs (10 tests)

product_pack:
  - Herald.Business
  - Herald.Game.Pro

maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-24

changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Migrated from Herald.Core Addons/NetworkTransports.
