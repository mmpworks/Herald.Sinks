name: Herald.Sinks.PagerDuty
package_id: MMP.Herald.Sinks.PagerDuty
version: 1.0.0
kind: sink
category: alerting

purpose: >
  Posts Herald log events to PagerDuty's Events API v2 for incident
  creation. Designed for high-severity alerting, not general log
  forwarding — stack behind a Warn-or-above filter so routine info
  events don't page the on-call rotation.

vendor:
  name: PagerDuty
  url: https://developer.pagerduty.com/api-reference/368ae3d938c9e-send-an-event

ships:
  - PagerDutyLogSink
  - PagerDutyLogSinkProvider
  - PagerDutySinkRegistration

requires:
  core_version: ">=1.0.0"
  external:
    - PagerDuty Events API v2 integration (routing key)

config:
  kind: pagerduty
  uri: "Optional endpoint override (region-specific or test intake)."
  host: "Optional PagerDuty 'source' field — defaults to machine name."
  alias: "Integration routing key."
  notes: >
    Component / group / custom dedup resolver are construction-only.
    Callers who need them pass a pre-built sink via WithCustomSinkProvider.

dashboard_config:
  - property: routing_key
    name: Routing key
    help: >
      The Events API v2 integration key configured in PagerDuty. Keys
      are per-service; a single sink posts every event to that service.
    tooltip: PagerDuty integration routing key — masked after save.
    width: m
    control: secret
    required: true
    min_length: 20
    group: Auth
    errors:
      required: "A routing key is required before incidents can be created."

  - property: source
    name: Source
    help: >
      Value emitted as PagerDuty's "source" field. Defaults to the
      machine name. A stable source string lets PagerDuty dedupe
      incidents across sink restarts.
    tooltip: PagerDuty 'source' field — defaults to machine name.
    width: m
    control: text
    required: false
    group: Identity

  - property: endpoint
    name: Endpoint override
    help: >
      Optional endpoint override. Use
      https://events.eu.pagerduty.com/v2/enqueue for the EU region,
      or a test intake URL. Leave blank for the default US endpoint.
    tooltip: Full endpoint URL; leave blank for the US events API.
    width: l
    control: url
    required: false
    placeholder: https://events.pagerduty.com/v2/enqueue
    group: Endpoint
    schemes: [https]

capabilities:
  - Events API v2 trigger payloads
  - Stable dedup-key derivation (event id → template → message hash)
  - Severity mapping to PagerDuty's four-value scale
  - Per-event custom_details bag with exception + properties + context
  - 1024-char defensive summary cap
  - Caller-supplied dedup resolver for per-event deduplication

limitations:
  - Only emits "trigger" actions — no ack / resolve workflow
  - Single-event POST (no batching)
  - Component / group / dedup resolver configurable at construction only

minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — shared HttpClient, synchronous Send.

test_coverage: tests/Herald.Sinks.PagerDuty.Tests/PagerDutyLogSinkTests.cs (6 tests)

product_pack:
  - Herald.Business

maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-24

changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Migrated from Herald.Core Addons/PagerDuty.
