name: Herald.Sinks.Elasticsearch
package_id: MMP.Herald.Sinks.Elasticsearch
version: 1.0.0
kind: sink
category: observability

purpose: >
  Sends Herald log events to Elasticsearch as JSON documents via the
  Bulk API. Uses time-based indexes (prefix-yyyy.MM.dd) and emits
  exceptions as a typed sub-object (type / message / stack) that
  Kibana's exception-tracking UI indexes as first-class fields.

vendor:
  name: Elastic
  url: https://www.elastic.co/guide/en/elasticsearch/reference/current/docs-bulk.html

ships:
  - ElasticsearchLogSink
  - ElasticsearchSinkProvider
  - ElasticsearchSinkRegistration

requires:
  core_version: ">=1.0.0"
  external:
    - Reachable Elasticsearch cluster (or Elastic Cloud)
    - Index-creation permission for {prefix}-{YYYY.MM.DD} indices

config:
  kind: elasticsearch
  uri: "Elasticsearch cluster root URL (e.g. https://es.internal:9200)."
  host: null
  alias: null
  notes: >
    Index prefix defaults to "herald-logs"; override only through the
    code constructor. The sink POSTs to /_bulk with
    application/x-ndjson content.

dashboard_config:
  - property: base_url
    name: Cluster URL
    help: >
      The Elasticsearch cluster root. The sink appends /_bulk to this
      URL on every request. Elastic Cloud URLs and self-hosted clusters
      both work unchanged.
    tooltip: Elasticsearch cluster URL.
    width: l
    control: url
    required: true
    placeholder: https://es.internal:9200
    group: Endpoint
    schemes: [http, https]
    errors:
      required: "A cluster URL is required."

capabilities:
  - Batched delivery via the Bulk API (one NDJSON request per batch)
  - Time-based indices ({prefix}-yyyy.MM.dd) for easy retention policies
  - Exception emission as typed sub-object (type / message / stack)
  - Separate properties / context namespaces guard against user-property
    collisions with reserved fields
  - Index-prefix regex validation at construction

limitations:
  - No auth support yet (API key / basic auth requires caller-supplied HttpClient)
  - Index prefix configurable at construction only
  - Synchronous Send path; pair with async decorator for throughput

minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — shared HttpClient is reentrant.

test_coverage: tests/Herald.Sinks.Elasticsearch.Tests/ElasticsearchLogSinkTests.cs (4 tests)

product_pack:
  - Herald.Business

maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-24

changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Migrated from Herald.Core Addons/CommunityTransports.
