name: Herald.Sinks.AzureEventHub
package_id: MMP.Herald.Sinks.AzureEventHub
version: 1.0.0
configContract: 2
formSchema: configuration-azure_event_hub.mmpform
kind: sink
category: queue
purpose: >
  Publishes Herald log events as messages to an Azure Event Hubs
  partition via EventHubProducerClient. Drop-in for
  Serilog.Sinks.AzureEventHub. Pairs with Herald.Sinks.Kafka for
  multi-cloud streaming setups.
vendor:
  name: Microsoft Azure
  url: https://learn.microsoft.com/azure/event-hubs/
ships:
  - AzureEventHubLogSink
  - AzureEventHubLogSinkProvider
  - AzureEventHubSinkRegistration
requires:
  core_version: ">=1.0.0"
  external:
    - Azure.Messaging.EventHubs
    - Azure.Identity (for DefaultAzureCredential overload)
    - Event Hubs namespace + hub
config:
  kind: azure_event_hub
  uri: "Connection string (required)."
  host: "Event Hub name (required)."

capabilities:
  - EventDataBatch with TryAdd → split-and-resend on 1 MB ceiling
  - DefaultAzureCredential overload for managed-identity scenarios
  - level / category copied to AMQP application-properties for routing
  - JSON body with ContentType=application/json
  - Code-first overload accepts a pre-built EventHubProducerClient
limitations:
  - Synchronous Send (.GetAwaiter().GetResult around async API)
  - No partition-key routing in 1.0
  - No SAS-only auth helper — feed via connection string
minimum_edition: Community
aot_compatible: true
thread_safety: Thread-safe — EventHubProducerClient is thread-safe per Azure SDK contract.
test_coverage: tests/Herald.Sinks.AzureEventHub.Tests/
product_pack: []
maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-24
changelog:
  - version: 1.0.0
    date: 2026-04-24
    summary: Initial release — 1.3 pack.
