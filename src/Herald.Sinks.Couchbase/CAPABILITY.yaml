name: Herald.Sinks.Couchbase
package_id: MMP.Herald.Sinks.Couchbase
version: 1.0.0
configContract: 2
formSchema: configuration-couchbase.mmpform
kind: sink
category: database
purpose: >
  Upserts Herald log events as JSON documents into a Couchbase
  bucket / scope / collection via CouchbaseNetClient. Drop-in for
  Serilog.Sinks.Couchbase. Composite document key sorts newest-first
  within a date prefix; N1QL queries land on Level / Category / TimeUtc
  fields.
vendor:
  name: Couchbase
  url: https://www.couchbase.com
ships:
  - CouchbaseLogSink
  - CouchbaseLogSinkProvider
  - CouchbaseSinkRegistration
requires:
  core_version: ">=1.0.0"
  external:
    - CouchbaseNetClient (>= 3.5)
    - Couchbase Server 6.6+ with the target bucket / scope / collection
config:
  kind: couchbase
  notes: >
    Code-first only — credentials cannot ride safely through the runtime
    sink definition without a secret-store integration. The provider
    throws when invoked; callers wire CouchbaseLogSink directly.

capabilities:
  - Upsert per event on the Log path
  - Concurrent UpsertAsync fan-out for IBatchedLogSink batches
  - Composite key (date#inverted-ticks#rand) for newest-first scans
  - Code-first overload accepts a pre-built ICouchbaseCollection
limitations:
  - Synchronous Log path uses GetAwaiter().GetResult around the async SDK
  - No native bulk upsert (the SDK exposes per-doc UpsertAsync only)
  - Provider throws — wire credentials via the code-first ctor
minimum_edition: Community
aot_compatible: false
thread_safety: Thread-safe — Cluster + Collection instances are thread-safe per Couchbase SDK contract.
aot_notes: >
  CouchbaseNetClient relies on internal reflection and is not AOT-clean.
  Users on PublishAot should pick a different NoSQL sink (MongoDB, RavenDB,
  and DynamoDB are all AOT-friendly).
test_coverage: tests/Herald.Sinks.Couchbase.Tests/
product_pack: []
maintenance:
  level: active
  owner: smuchow1962
  last_audit: 2026-04-25
changelog:
  - version: 1.0.0
    date: 2026-04-25
    summary: Initial release — 1.4 NoSQL pack.
